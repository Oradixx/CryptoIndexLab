name: cryptoindexlab

services:
  frontend:
    build:
      context: ./frontend
    container_name: cryptoindexlab-frontend
    restart: unless-stopped
    environment:
      FRONTEND_PUBLIC_API1_URL: "${FRONTEND_PUBLIC_API1_URL:-/api1}"
      FRONTEND_PUBLIC_API2_URL: "${FRONTEND_PUBLIC_API2_URL:-/api2}"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    networks:
      - frontend-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`localhost`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=8080"

  traefik:
    image: traefik:v3.0
    container_name: cryptoindexlab-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - frontend-net

  api1:
    build:
      context: ./api1
    container_name: cryptoindexlab-api1
    restart: unless-stopped
    ports:
      - "${API1_PORT:-8001}:8001"
    environment:
      PORT: 8001
      API1_LOG_LEVEL: "${API1_LOG_LEVEL:-info}"
      API1_JWT_SECRET: "${API1_JWT_SECRET:-change_me_for_dev_only}"
      API1_TOKEN_TTL_SECONDS: "${API1_TOKEN_TTL_SECONDS:-3600}"
      API1_DATABASE_URL: "${API1_DATABASE_URL:-postgresql+psycopg2://crypto_user:crypto_pass@db1:5432/crypto_auth}"
      API1_DB_INIT_MAX_ATTEMPTS: "${API1_DB_INIT_MAX_ATTEMPTS:-10}"
      API1_DB_INIT_RETRY_DELAY_SECONDS: "${API1_DB_INIT_RETRY_DELAY_SECONDS:-2}"
    depends_on:
      db1:
        condition: service_healthy
    networks:
      - frontend-net
      - api1-db-net

  api2:
    build:
      context: ./api2
    container_name: cryptoindexlab-api2
    restart: unless-stopped
    ports:
      - "${API2_PORT:-8002}:8002"
    environment:
      PORT: 8002
      API2_LOG_LEVEL: "${API2_LOG_LEVEL:-info}"
      API2_DATABASE_URL: "${API2_DATABASE_URL:-postgresql+psycopg2://crypto_user:crypto_pass@db2:5432/crypto_index}"
      API2_DB_INIT_MAX_ATTEMPTS: "${API2_DB_INIT_MAX_ATTEMPTS:-10}"
      API2_DB_INIT_RETRY_DELAY_SECONDS: "${API2_DB_INIT_RETRY_DELAY_SECONDS:-2}"
      API2_MARKET_DATA_BASE_URL: "${API2_MARKET_DATA_BASE_URL:-https://api.coingecko.com/api/v3}"
      API2_MARKET_DATA_TIMEOUT_SECONDS: "${API2_MARKET_DATA_TIMEOUT_SECONDS:-10}"
      API2_MARKET_DATA_CURRENCY: "${API2_MARKET_DATA_CURRENCY:-usd}"
      API2_MARKET_DATA_DAYS: "${API2_MARKET_DATA_DAYS:-365}"
      API2_MARKET_DATA_CACHE_TTL_SECONDS: "${API2_MARKET_DATA_CACHE_TTL_SECONDS:-300}"
      API2_MARKET_DATA_API_KEY: "${API2_MARKET_DATA_API_KEY:-}"
      API2_AUTH_API1_ME_URL: "${API2_AUTH_API1_ME_URL:-http://api1:8001/me}"
      API2_AUTH_TIMEOUT_SECONDS: "${API2_AUTH_TIMEOUT_SECONDS:-5}"
    depends_on:
      db2:
        condition: service_healthy
      api1:
        condition: service_healthy
    networks:
      - frontend-net
      - api2-db-net

  db1:
    image: postgres:16-alpine
    container_name: cryptoindexlab-db1
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB1_NAME:-crypto_auth}"
      POSTGRES_USER: "${DB1_USER:-crypto_user}"
      POSTGRES_PASSWORD: "${DB1_PASSWORD:-crypto_pass}"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB1_USER:-crypto_user} -d ${DB1_NAME:-crypto_auth}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - db1-data:/var/lib/postgresql/data
    networks:
      - api1-db-net

  db2:
    image: postgres:16-alpine
    container_name: cryptoindexlab-db2
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB2_NAME:-crypto_index}"
      POSTGRES_USER: "${DB2_USER:-crypto_user}"
      POSTGRES_PASSWORD: "${DB2_PASSWORD:-crypto_pass}"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB2_USER:-crypto_user} -d ${DB2_NAME:-crypto_index}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - db2-data:/var/lib/postgresql/data
    networks:
      - api2-db-net

volumes:
  db1-data:
  db2-data:


networks:
  frontend-net:
    driver: bridge
  api1-db-net:
    driver: bridge
  api2-db-net:
    driver: bridge
