name: cryptoindexlab

services:
  frontend:
    build:
      context: ./frontend
    container_name: cryptoindexlab-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      FRONTEND_PUBLIC_API1_URL: "${FRONTEND_PUBLIC_API1_URL:-http://api1:8001}"
      FRONTEND_PUBLIC_API2_URL: "${FRONTEND_PUBLIC_API2_URL:-http://api2:8002}"
    depends_on:
      - api1
      - api2
    networks:
      - cryptoindexlab-net

  api1:
    build:
      context: ./api1
    container_name: cryptoindexlab-api1
    ports:
      - "${API1_PORT:-8001}:8001"
    environment:
      PORT: 8001
      API1_LOG_LEVEL: "${API1_LOG_LEVEL:-info}"
      API1_JWT_SECRET: "${API1_JWT_SECRET:-change_me_for_dev_only}"
      API1_TOKEN_TTL_SECONDS: "${API1_TOKEN_TTL_SECONDS:-3600}"
      API1_DATABASE_URL: "${API1_DATABASE_URL:-postgresql+psycopg2://crypto_user:crypto_pass@db1:5432/crypto_auth}"
    depends_on:
      db1:
        condition: service_healthy
    networks:
      - cryptoindexlab-net

  api2:
    build:
      context: ./api2
    container_name: cryptoindexlab-api2
    ports:
      - "${API2_PORT:-8002}:8002"
    environment:
      PORT: 8002
      API2_LOG_LEVEL: "${API2_LOG_LEVEL:-info}"
      API2_DATABASE_URL: "${API2_DATABASE_URL:-postgresql://crypto_user:crypto_pass@db2:5432/crypto_index}"
    depends_on:
      - db2
    networks:
      - cryptoindexlab-net

  db1:
    image: postgres:16-alpine
    container_name: cryptoindexlab-db1
    environment:
      POSTGRES_DB: "${DB1_NAME:-crypto_auth}"
      POSTGRES_USER: "${DB1_USER:-crypto_user}"
      POSTGRES_PASSWORD: "${DB1_PASSWORD:-crypto_pass}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB1_USER:-crypto_user} -d ${DB1_NAME:-crypto_auth}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db1-data:/var/lib/postgresql/data
    networks:
      - cryptoindexlab-net

  db2:
    image: postgres:16-alpine
    container_name: cryptoindexlab-db2
    ports:
      - "${DB2_PORT:-5434}:5432"
    environment:
      POSTGRES_DB: "${DB2_NAME:-crypto_index}"
      POSTGRES_USER: "${DB2_USER:-crypto_user}"
      POSTGRES_PASSWORD: "${DB2_PASSWORD:-crypto_pass}"
    volumes:
      - db2-data:/var/lib/postgresql/data
    networks:
      - cryptoindexlab-net

volumes:
  db1-data:
  db2-data:

networks:
  cryptoindexlab-net:
    driver: bridge
