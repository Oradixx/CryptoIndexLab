resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # ── Frontend (SPA) ──
    location / {
        proxy_pass http://frontend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API1 – load-balanced across replicas via Docker DNS ──
    location = /api1 { return 301 /api1/; }
    location /api1/ {
        set $upstream_api1 http://api1:8001;
        rewrite ^/api1(/.*)$ $1 break;
        proxy_pass $upstream_api1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API2 – load-balanced across replicas via Docker DNS ──
    location = /api2 { return 301 /api2/; }
    location /api2/ {
        set $upstream_api2 http://api2:8002;
        rewrite ^/api2(/.*)$ $1 break;
        proxy_pass $upstream_api2;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
